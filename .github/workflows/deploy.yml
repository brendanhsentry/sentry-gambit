name: deploy
on:
  push:
    branches: [main]
# newer push cancels an in-flight deploy so an old build can't finish last
# and overwrite a newer one
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/714494020823/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gha-sentry-gambit@devinfra-remote-dev.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/sentry-gambit:${{ github.sha }}
          cache-from: type=registry,ref=us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/sentry-gambit:buildcache
          cache-to: type=registry,ref=us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/sentry-gambit:buildcache,mode=max
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: sentry-gambit
          project_id: devinfra-remote-dev
          region: us-west1
          image: us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/sentry-gambit:${{ github.sha }}
          # single instance: live game state is in memory, persisted to Firestore
          flags: >-
            --max-instances=1
            --timeout=3600
            --memory=512Mi
            --update-secrets=SEER_API_TOKEN=seer-api-token:latest
